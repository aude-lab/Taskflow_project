{% extends "base.html" %}

{% block title %}Supprimer {{ task.title }} — TaskFlow{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-1">Supprimer « {{ task.title }} » ?</h1>
          <p class="text-muted small mb-3">Projet : {{ task.project.name }}</p>

          <p>Cette action est irréversible.</p>

          <form method="post">
            {% csrf_token %}
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-danger">
                Supprimer définitivement
              </button>
              <a class="btn btn-outline-secondary"
                 href="{% url 'project_detail' task.project.pk %}">Annuler</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
